<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Online - RGB Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f8f9fa}
.hero{background:#111;color:#fff;padding:50px 0;text-align:center;border-radius:0 0 20px 20px}
.card img{height:180px;object-fit:cover}
</style>
</head>
<body>

<div class="hero">
<h1>RGB STORE</h1>
<p>Toko Online Murah, Cepat & Terpercaya</p>
<button class="btn btn-warning" onclick="lihatKeranjang()">🛒 Lihat Keranjang (<span id="jumlahCart">0</span>)</button>
</div>

<div class="container my-4">
<div class="row" id="listProduk"></div>
</div>

<div class="container mb-5">
<h3>Keranjang Belanja</h3>
<ul class="list-group" id="cartList"><li class="list-group-item">Keranjang masih kosong</li></ul>
<h4 class="mt-3">Total: <span id="totalHarga">Rp 0</span></h4>
<button class="btn btn-success" onclick="checkoutWA()">Checkout via WhatsApp</button>
<button class="btn btn-danger" onclick="hapusCart()">Hapus Keranjang</button>
</div>

<script>
const products=[
{id:1,nama:"Sepatu Sneakers",harga:250000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",desc:"Sepatu keren, nyaman dipakai sehari-hari"},
{id:2,nama:"Hoodie Hitam",harga:180000,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500",desc:"Hoodie tebal, bahan premium"},
{id:3,nama:"Jam Tangan",harga:350000,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",desc:"Jam tangan stylish untuk cowok/cewek"},
{id:4,nama:"Tas Ransel",harga:220000,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",desc:"Tas ransel muat laptop 14 inch"},
{id:5,nama:"Kacamata",harga:120000,img:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500",desc:"Kacamata anti radiasi & gaya"},
{id:6,nama:"Headphone",harga:400000,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",desc:"Headphone bass nendang, baterai awet"},
];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function formatRupiah(n){return 'Rp '+n.toLocaleString('id-ID')}
function tampilkanProduk(){
let html='';
products.forEach(p=>{
html+=`<div class="col-md-4 mb-3"><div class="card"><img src="${p.img}" class="card-img-top"><div class="card-body"><h5>${p.nama}</h5><p>${p.desc}</p><h6>${formatRupiah(p.harga)}</h6><button class="btn btn-primary w-100" onclick="tambah(${p.id})">+ Tambah ke Keranjang</button></div></div></div>`;
});
document.getElementById('listProduk').innerHTML=html;
tampilkanCart();
}
function tambah(id){
let item=cart.find(x=>x.id===id);
if(item) item.qty++;
else {let p=products.find(x=>x.id===id); cart.push({...p,qty:1})}
localStorage.setItem('cart',JSON.stringify(cart));
tampilkanCart();
}
function tampilkanCart(){
document.getElementById('jumlahCart').innerText=cart.reduce((a,b)=>a+b.qty,0);
let total=cart.reduce((a,b)=>a+b.harga*b.qty,0);
document.getElementById('totalHarga').innerText=formatRupiah(total);
if(cart.length===0){document.getElementById('cartList').innerHTML='<li class="list-group-item">Keranjang masih kosong</li>';return}
document.getElementById('cartList').innerHTML=cart.map(c=>`<li class="list-group-item d-flex justify-content-between">${c.nama} x ${c.qty} <b>${formatRupiah(c.harga*c.qty)}</b></li>`).join('');
}
function lihatKeranjang(){window.scrollTo(0,document.body.scrollHeight)}
function hapusCart(){cart=[];localStorage.removeItem('cart');tampilkanCart()}
function checkoutWA(){
if(cart.length===0){alert('Keranjang masih kosong!');return}
let pesan='Halo, saya mau pesan:\n';
cart.forEach(c=>{pesan+=`- ${c.nama} x ${c.qty} = ${formatRupiah(c.harga*c.qty)}\n`});
let total=cart.reduce((a,b)=>a+b.harga*b.qty,0);
pesan+=`Total: ${formatRupiah(total)}`;
window.open('https://wa.me/6285178360714?text='+encodeURIComponent(pesan),'_blank');
}
tampilkanProduk();
</script>
</body>
</html>
